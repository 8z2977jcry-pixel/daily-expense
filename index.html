<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#116b55"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>每日支出</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;color:#16312b;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#116b55;color:white;padding:24px 18px 20px}header h1{margin:0 0 6px;font-size:25px}header small{opacity:.85}.wrap{max-width:680px;margin:auto;padding:14px}.panel{background:white;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #1232}label{display:block;font-weight:650;font-size:14px;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #d3ded9;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#183b31}textarea{min-height:70px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{background:#116b55;color:white;border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer}.secondary{background:#e6f2ed;color:#116b55}.danger{background:#fff1ef;color:#a3342b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.total{font-size:27px;font-weight:750;color:#116b55}.muted{color:#6b7d74;font-size:13px}.entry{border-top:1px solid #e9eeeb;padding:13px 0}.entry:first-of-type{border-top:0}.entry-head{display:flex;justify-content:space-between;gap:10px}.amount{font-weight:750;font-size:19px}.thumb{height:70px;width:70px;object-fit:cover;border-radius:8px;margin:7px 5px 0 0;cursor:pointer}.hint{font-size:12px;color:#718179;margin-top:8px}.empty{padding:22px;text-align:center;color:#72857b}#photos{display:flex;gap:8px;flex-wrap:wrap}#photos img{height:62px;width:62px;object-fit:cover;border-radius:8px}@media print{header,.no-print,#formPanel,.entry button{display:none!important}body{background:white}.panel{box-shadow:none;border:1px solid #ddd}.wrap{max-width:none}.entry{break-inside:avoid}}</style></head><body><header><h1>每日支出</h1><small>快速记账 · 拍照收据 · PDF 导出</small></header><main class="wrap"><section class="panel no-print" id="formPanel"><h2 style="margin:0">新增支出</h2><form id="expenseForm"><label for="amount">金额（EGP）</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="例如 250"><div class="grid"><div><label for="date">日期</label><input id="date" type="date" required></div><div><label for="time">时间</label><input id="time" type="time" required></div></div><label for="category">分类</label><select id="category"><option>工作支出</option><option>餐饮</option><option>交通</option><option>采购</option><option>生活费</option><option>其他</option></select><label for="note">备注 / 地点</label><textarea id="note" placeholder="买了什么、在哪里、给谁付款……"></textarea><label for="file">收据照片（可拍照或从相册选择，多张）</label><input id="file" type="file" accept="image/*" multiple><div id="photos"></div><div class="actions"><button class="btn" type="submit">保存这笔支出</button><button class="btn secondary" type="reset">清空</button></div><div class="hint">数据保存在当前浏览器中。请定期导出备份，清除浏览器数据可能导致记录丢失。</div></form></section><section class="panel"><div class="muted">累计支出（当前筛选）</div><div class="total" id="total">0.00 EGP</div><div class="grid no-print"><div><label for="from">开始日期</label><input id="from" type="date"></div><div><label for="to">结束日期</label><input id="to" type="date"></div></div><div class="actions no-print"><button class="btn" id="pdf" type="button">导出 PDF</button><button class="btn secondary" id="backup" type="button">备份 JSON</button><button class="btn secondary" id="csv" type="button">导出 CSV</button><label class="btn secondary" style="margin:0;cursor:pointer">恢复备份<input id="restore" type="file" accept="application/json" style="display:none"></label></div><div class="hint no-print">PDF：点击后在手机打印菜单选择「另存为 PDF」。备份 JSON 包含照片，请妥善保管。</div></section><section class="panel"><h2 style="margin:0 0 12px">支出记录</h2><div id="list"></div></section></main><script>
const KEY='daily-expense-v2-records';let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch{}const $=id=>document.getElementById(id);const now=()=>{let d=new Date();return {date:[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),time:[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0')].join(':')}};function setNow(){const x=now();$('date').value=x.date;$('time').value=x.time}setNow();function save(){localStorage.setItem(KEY,JSON.stringify(records))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});function filtered(){return records.filter(r=>(!$('from').value||r.date>=$('from').value)&&(!$('to').value||r.date<=$('to').value)).sort((a,b)=>(b.date+' '+b.time).localeCompare(a.date+' '+a.time))}function render(){const arr=filtered();$('total').textContent=money(arr.reduce((s,r)=>s+Number(r.amount),0))+' EGP';$('list').innerHTML=arr.length?arr.map(r=>`<article class="entry"><div class="entry-head"><div><strong>${esc(r.category)}</strong><div class="muted">${esc(r.date)} ${esc(r.time)}</div></div><div class="amount">${money(r.amount)} EGP</div></div>${r.note?`<div style="white-space:pre-wrap;margin-top:7px">${esc(r.note)}</div>`:''}<div>${(r.photos||[]).map((p,i)=>`<img class="thumb" src="${p}" alt="收据 ${i+1}" data-view="${esc(r.id)}" data-index="${i}">`).join('')}</div><button class="btn danger no-print" style="padding:7px 11px;margin-top:8px" data-delete="${esc(r.id)}">删除</button></article>`).join(''):'<div class="empty">还没有支出记录</div>'}render();$('from').onchange=render;$('to').onchange=render;function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const ratio=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('图片无法读取'))};img.src=u})}let staged=[];$('file').onchange=async e=>{try{staged=await Promise.all([...e.target.files].map(shrink));$('photos').innerHTML=staged.map(p=>`<img src="${p}" alt="待保存照片">`).join('')}catch(err){alert(err.message)}};$('expenseForm').onsubmit=e=>{e.preventDefault();const r={id:String(Date.now())+'-'+Math.random().toString(36).slice(2),amount:Number($('amount').value),date:$('date').value,time:$('time').value,category:$('category').value,note:$('note').value.trim(),photos:staged};if(!Number.isFinite(r.amount)||r.amount<=0)return alert('请输入正确金额');records.push(r);try{save()}catch(err){records.pop();return alert('手机存储空间不足，照片可能太多。请减少照片数量后重试。')}e.target.reset();staged=[];$('photos').innerHTML='';setNow();render();alert('保存成功')};$('expenseForm').onreset=()=>{staged=[];$('photos').innerHTML='';setTimeout(setNow,0)};$('list').onclick=e=>{const id=e.target.dataset.delete;if(id){if(confirm('确定删除这笔记录？')){records=records.filter(r=>r.id!==id);save();render()}return}const img=e.target.closest('[data-view]');if(img){const r=records.find(x=>x.id===img.dataset.view);if(r){const w=window.open();if(w){w.document.write('<title>收据照片</title><img style="max-width:100%;height:auto" src="'+r.photos[Number(img.dataset.index)]+'">');w.document.close()}else alert('请允许浏览器打开图片窗口')}}};function download(name,data,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}$('backup').onclick=()=>download('每日支出备份-'+now().date+'.json',JSON.stringify({version:2,records},null,2),'application/json');$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.records))throw Error('格式不正确');if(!confirm('恢复备份会替换当前全部记录，确定继续吗？'))return;records=obj.records;save();render();alert('恢复成功')}catch(err){alert('恢复失败：'+err.message)}finally{e.target.value=''}};$('csv').onclick=()=>{const rows=[['日期','时间','分类','金额 EGP','备注'],...filtered().map(r=>[r.date,r.time,r.category,r.amount,r.note])];download('每日支出-'+now().date+'.csv','\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('pdf').onclick=()=>window.print();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
