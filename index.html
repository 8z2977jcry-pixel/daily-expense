<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d33"><link rel="manifest" href="manifest.webmanifest"><title>每日支出</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f5;color:#19352e;margin:0}header{background:#153d33;color:white;padding:24px 18px}main{max-width:640px;margin:auto;padding:16px}.panel{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 1px 5px #0001}h1{margin:0;font-size:24px}label{display:block;margin:13px 0 5px;font-weight:600}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cdd6d1;border-radius:9px;padding:12px;font-size:16px}textarea{height:78px}button{border:0;background:#153d33;color:white;padding:13px;border-radius:10px;font-size:16px;cursor:pointer}button.alt{background:#e6eeea;color:#153d33}button.danger{background:#a92f2f}button:disabled{opacity:.5}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.entry{border-top:1px solid #ddd;padding:12px 0}.entry img{max-width:95px;max-height:95px;border-radius:7px;margin:5px}.muted{color:#64756e;font-size:13px}.total{font-size:22px;font-weight:bold}#status{color:#9a391d} @media print{header,.form,.actions,.entry button,.no-print{display:none!important}body{background:white}.panel{box-shadow:none}main{max-width:none}.entry{break-inside:avoid}.entry img{max-width:160px;max-height:160px}}</style></head><body><header><h1>💰 每日支出</h1><div>拍照 · 备注 · 金额 · PDF</div></header><main><section class="panel form"><label>金额（EGP）</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="例如 250"><label>日期和时间</label><input id="when" type="datetime-local"><label>备注</label><textarea id="note" placeholder="买了什么？在哪里？"></textarea><label>收据照片（可多选，可直接拍照）</label><input id="photos" type="file" accept="image/*" multiple><div class="buttons"><button id="save">保存记录</button><button class="alt" id="reset">清空输入</button></div><p id="status" role="status"></p></section><section class="panel"><div class="total" id="total">合计：0.00 EGP</div><div class="buttons actions"><button id="pdf">导出 PDF</button><button class="alt" id="backup">备份数据</button><button class="alt" id="restoreBtn">导入备份</button><input id="restore" type="file" accept="application/json" hidden></div><p class="muted no-print">导出 PDF 时，选择“打印”→“保存为 PDF”。照片和记录仅存于当前浏览器，建议定期备份。删除浏览器数据可能导致记录丢失。</p><div id="records"></div></section></main><script>
const $=s=>document.getElementById(s),dbName='daily-expenses-v2';let db,editId=null;function localDate(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}$('when').value=localDate();
function request(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function openDb(){return new Promise((ok,no)=>{let r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore('expenses',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(){let t=db.transaction('expenses','readonly');return (await request(t.objectStore('expenses').getAll())).sort((a,b)=>b.when.localeCompare(a.when))}async function put(v){await request(db.transaction('expenses','readwrite').objectStore('expenses').put(v))}async function remove(id){await request(db.transaction('expenses','readwrite').objectStore('expenses').delete(id))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function readFile(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)})}async function shrink(f){let src=await readFile(f);try{let img=new Image();img.src=src;await img.decode();let scale=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}catch(e){return src}}
function clear(){editId=null;$('amount').value='';$('note').value='';$('when').value=localDate();$('photos').value='';$('save').textContent='保存记录';$('status').textContent=''}$('reset').onclick=clear;
$('save').onclick=async()=>{let amount=Number($('amount').value),when=$('when').value;if(!Number.isFinite(amount)||amount<=0||!when){$('status').textContent='请填写正确金额和日期时间';return}let btn=$('save');btn.disabled=true;try{let old=editId?(await request(db.transaction('expenses').objectStore('expenses').get(editId))):null;let photos=old?.photos||[];for(let f of $('photos').files)photos.push(await shrink(f));await put({id:editId||crypto.randomUUID(),amount,when,note:$('note').value,photos});clear();await render()}catch(e){$('status').textContent='保存失败：'+e.message}finally{btn.disabled=false}};
async function render(){let arr=await all();$('total').textContent='合计：'+arr.reduce((s,v)=>s+Number(v.amount),0).toFixed(2)+' EGP';$('records').innerHTML=arr.length?arr.map(v=>`<div class="entry"><strong>${Number(v.amount).toFixed(2)} EGP</strong><div class="muted">${esc(v.when.replace('T',' '))}</div><div style="white-space:pre-wrap">${esc(v.note)}</div><div>${(v.photos||[]).map(p=>`<img src="${p}" alt="收据照片">`).join('')}</div><div class="buttons actions"><button class="alt" data-edit="${v.id}">修改</button><button class="danger" data-delete="${v.id}">删除</button></div></div>`).join(''):'<p class="muted">还没有记录，先添加第一笔支出。</p>'}
$('records').onclick=async e=>{let id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;if(e.target.dataset.delete){if(confirm('确定删除这笔记录和照片吗？')){await remove(id);render()}return}let v=await request(db.transaction('expenses').objectStore('expenses').get(id));editId=id;$('amount').value=v.amount;$('when').value=v.when;$('note').value=v.note;$('save').textContent='保存修改';window.scrollTo({top:0,behavior:'smooth'})};
$('pdf').onclick=()=>window.print();$('backup').onclick=async()=>{let blob=new Blob([JSON.stringify(await all())],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='每日支出备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=async e=>{try{let arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr))throw Error('文件格式不正确');if(!confirm('导入 '+arr.length+' 条记录？同 ID 记录会覆盖。'))return;for(let v of arr){if(v.id&&v.when&&Number.isFinite(Number(v.amount)))await put(v)}render()}catch(err){alert('导入失败：'+err.message)}};
openDb().then(d=>{db=d;render()}).catch(e=>$('status').textContent='当前浏览器不支持保存：'+e.message);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
